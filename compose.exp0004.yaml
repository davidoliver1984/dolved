services:
  api:
    volumes: !override
      - ./apps/api:/app
      - ./contracts:/contracts:ro
      - ./tests/evaluation/engineering-snapshots:/evaluation/engineering-snapshots:ro
      - ./docs/evaluation/runs:/evaluation-runs
      - ${EXP0004_PROVISIONING_RECORD:?Set EXP0004_PROVISIONING_RECORD to the verified isolated copy}:/app/storage/app/private/evaluation/dolved-care-engineering/v2/provisioning.json:ro
      - api_vendor:/app/vendor

  ai:
    volumes: !override
      - ./apps/ai:/app
      - ./contracts:/contracts:ro
      - ./tests/evaluation/engineering-snapshots:/evaluation/engineering-snapshots:ro
      - ./docs/evaluation/runs:/evaluation-runs
      - ./scripts:/workspace/scripts:ro
      - ai_venv:/app/.venv
      - fastembed_cache:/opt/fastembed-cache
