receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp_http/local_backend:
    endpoint: ${env:OTEL_BACKEND_OTLP_ENDPOINT}
    compression: gzip
    sending_queue:
      enabled: true
    retry_on_failure:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_http/local_backend
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_http/local_backend
