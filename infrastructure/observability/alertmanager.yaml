---
global:
  resolve_timeout: 5m

route:
  receiver: local-inspection
  group_by:
    - alertname
    - subsystem
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-inspection

inhibit_rules:
  - source_matchers:
      - severity="urgent"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - subsystem
