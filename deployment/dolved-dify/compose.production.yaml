name: ${COMPOSE_PROJECT_NAME:-dolved-pilot}

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Dolved}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: https://${API_DOMAIN:?API_DOMAIN is required}
  FRONTEND_URL: https://${DOLVED_DOMAIN:?DOLVED_DOMAIN is required}
  CORS_ALLOWED_ORIGINS: https://${DOLVED_DOMAIN}
  SANCTUM_STATEFUL_DOMAINS: ${DOLVED_DOMAIN}
  SESSION_DRIVER: database
  SESSION_COOKIE: rag-platform-session
  SESSION_DOMAIN: ${SESSION_DOMAIN:?SESSION_DOMAIN is required}
  SESSION_SECURE_COOKIE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: lax
  AUTH_REGISTRATION_ENABLED: "false"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-dolved}
  DB_USERNAME: ${POSTGRES_USER:-dolved}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_QUEUE_CONNECTION: pgsql
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: s3
  DOCUMENT_STORAGE_DISK: s3
  DOCUMENT_UPLOAD_DISK: s3_uploads
  BRANDING_WORKSPACE_PUBLIC_ID: ${BRANDING_WORKSPACE_PUBLIC_ID:-}
  BRANDING_ASSET_DISK: ${BRANDING_ASSET_DISK:-s3}
  DOCUMENT_PROCESSING_DRIVER: dify
  IMPORT_PREFLIGHT_DRIVER: local
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${DOCUMENT_UPLOAD_BUCKET:-dolved-originals}
  AWS_ENDPOINT: http://objectstore:8333
  AWS_UPLOAD_ENDPOINT: https://${STORAGE_DOMAIN:?STORAGE_DOMAIN is required}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  DIFY_BASE_URL: http://dify-nginx
  DIFY_APP_API_KEY: ${DIFY_APP_API_KEY:?DIFY_APP_API_KEY is required}
  DIFY_KNOWLEDGE_API_KEY: ${DIFY_KNOWLEDGE_API_KEY:?DIFY_KNOWLEDGE_API_KEY is required}
  DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-180}
  DIFY_CONNECT_TIMEOUT_SECONDS: ${DIFY_CONNECT_TIMEOUT_SECONDS:-10}
  DIFY_DOCUMENT_SYNC_QUEUE: document-administration
  CONVERSATION_QUEUE: conversation-generation
  DOCUMENT_ADMINISTRATION_QUEUE: document-administration
  DOCUMENT_GOVERNANCE_QUEUE: document-governance
  LOG_CHANNEL: stderr
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_SERVICE_NAME: dolved-pilot-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-250}
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
  OPERATIONAL_METRICS_ENABLED: ${OPERATIONAL_METRICS_ENABLED:-true}
  OPERATIONAL_METRICS_URL: http://otel-lgtm:9090
  OPERATIONAL_METRICS_TIMEOUT_SECONDS: ${OPERATIONAL_METRICS_TIMEOUT_SECONDS:-1}
  OPERATIONAL_METRICS_CACHE_SECONDS: ${OPERATIONAL_METRICS_CACHE_SECONDS:-10}
  OPERATIONAL_GRAFANA_URL: https://${DOLVED_DOMAIN}/__ops/grafana/
  OPERATIONAL_ALERTMANAGER_URL: http://alertmanager:9093/__ops/alerts
  OPERATIONAL_ALERTMANAGER_PUBLIC_URL: https://${DOLVED_DOMAIN}/__ops/alerts/
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
  MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Dolved}

x-api-service: &api-service
  build:
    context: ../../apps/api
    target: production
    args:
      VCS_REF: ${DOLVED_SOURCE_REVISION:-unknown}
    additional_contexts:
      contracts: ../../contracts
  image: dolved-api:${DOLVED_IMAGE_TAG:-local}
  environment: *api-environment
  logging: *bounded-logging
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dolved}
      POSTGRES_USER: ${POSTGRES_USER:-dolved}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *bounded-logging
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  objectstore:
    image: chrislusf/seaweedfs:4.53
    entrypoint: [/bin/sh, /config/seaweedfs-entrypoint.sh]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    volumes:
      - object_data:/data
      - ./seaweedfs-entrypoint.sh:/config/seaweedfs-entrypoint.sh:ro
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9333/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *bounded-logging
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  migrate:
    <<: *api-service
    command: php artisan migrate --force
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *api-service
    command: php artisan documents:ensure-storage
    depends_on:
      objectstore:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    networks:
      - default
      - dify_backplane
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *api-service
    networks:
      - default
      - dify_backplane
    command: php artisan queue:work conversation --queue=conversation-generation,document-administration,document-governance --tries=1 --timeout=900 --sleep=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    stop_grace_period: 30s

  scheduler:
    <<: *api-service
    command: php artisan schedule:work
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  web:
    build:
      context: ../../apps/web
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}
        VCS_REF: ${DOLVED_SOURCE_REVISION:-unknown}
    image: dolved-web:${DOLVED_IMAGE_TAG:-local}
    environment:
      API_INTERNAL_URL: http://api
      AUTH_REGISTRATION_ENABLED: "false"
      FRONTEND_URL: https://${DOLVED_DOMAIN}
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *bounded-logging
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      - --web.external-url=https://${DOLVED_DOMAIN}/__ops/alerts/
      - --web.route-prefix=/__ops/alerts/
    volumes:
      - ../../infrastructure/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: [CMD, /bin/amtool, --alertmanager.url=http://127.0.0.1:9093/__ops/alerts/, config, show]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *bounded-logging
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:0.29.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_ROOT_URL: https://${DOLVED_DOMAIN}/__ops/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - telemetry_data:/data
      - ../../infrastructure/observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ../../infrastructure/observability/rules:/etc/dolved-observability/rules:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 20s
    logging: *bounded-logging
    mem_limit: 1536m
    cpus: 1.0
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.153.0
    command:
      - --config=/etc/otelcol/config.yaml
    environment:
      OTEL_BACKEND_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_TRACE_SAMPLING_PERCENTAGE: ${OTEL_TRACE_SAMPLING_PERCENTAGE:-100}
    volumes:
      - ../../infrastructure/opentelemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    depends_on:
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: [CMD, /otelcol, validate, --config=/etc/otelcol/config.yaml]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    logging: *bounded-logging
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      DOLVED_DOMAIN: ${DOLVED_DOMAIN:?DOLVED_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?STORAGE_DOMAIN is required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/dolved/caddy-sites:/etc/caddy/external-sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    logging: *bounded-logging
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

volumes:
  alertmanager_data:
  postgres_data:
  object_data:
  telemetry_data:
  caddy_data:
  caddy_config:

networks:
  dify_backplane:
    external: true
    name: dolved-dify-backplane
