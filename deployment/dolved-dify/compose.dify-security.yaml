x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  db_postgres:
    logging: *bounded-logging
    mem_limit: 512m
    cpus: 1.0

  redis:
    logging: *bounded-logging
    mem_limit: 128m
    cpus: 0.5

  weaviate:
    logging: *bounded-logging
    mem_limit: 512m
    cpus: 2.0

  init_permissions:
    logging: *bounded-logging
    mem_limit: 128m
    cpus: 0.5

  api:
    logging: *bounded-logging
    mem_limit: 1g
    cpus: 2.0

  worker:
    logging: *bounded-logging
    mem_limit: 1g
    cpus: 2.0

  worker_beat:
    logging: *bounded-logging
    mem_limit: 768m
    cpus: 1.0

  api_websocket:
    logging: *bounded-logging
    mem_limit: 768m
    cpus: 1.0

  web:
    logging: *bounded-logging
    mem_limit: 384m
    cpus: 1.0

  sandbox:
    logging: *bounded-logging
    mem_limit: 256m
    cpus: 0.5

  ssrf_proxy:
    logging: *bounded-logging
    mem_limit: 128m
    cpus: 0.5

  agent_backend:
    logging: *bounded-logging
    mem_limit: 384m
    cpus: 1.0

  agent_ssrf_proxy:
    logging: *bounded-logging
    mem_limit: 128m
    cpus: 0.5

  local_sandbox:
    logging: *bounded-logging
    mem_limit: 256m
    cpus: 0.5

  nginx:
    # Dify is an internal dependency and administration surface. Dolved reaches
    # it through the isolated Docker backplane; the host listener remains
    # loopback-only for an administrator SSH tunnel.
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      default:
      dolved_dify_backplane:
        aliases:
          - dify-nginx
    logging: *bounded-logging
    mem_limit: 128m
    cpus: 0.5

  plugin_daemon:
    # The stock compose publishes a remote plugin-debugging port by default.
    # Dolved does not use it.
    ports: !reset []
    logging: *bounded-logging
    mem_limit: 256m
    cpus: 0.5

networks:
  dolved_dify_backplane:
    external: true
    name: dolved-dify-backplane

