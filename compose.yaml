name: ${COMPOSE_PROJECT_NAME:-rag-platform}

services:
  web:
    build:
      context: ./apps/web
      target: development
    image: rag-platform-web:development
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      REPOSITORY_ROOT: /workspace
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
      - .:/workspace:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ./apps/api
      target: development
    image: rag-platform-api:development
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_NAME: Dolved
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      AI_SERVICE_URL: http://ai:8001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_COOKIE: rag-platform-session
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-rag_platform}
      DB_USERNAME: ${POSTGRES_USER:-rag_platform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      FILESYSTEM_DISK: s3
      QUEUE_CONNECTION: sqs
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${DOCUMENT_UPLOAD_BUCKET:-rag-platform-document-uploads-local}
      AWS_ENDPOINT: http://localstack:4566
      AWS_UPLOAD_ENDPOINT: ${AWS_UPLOAD_ENDPOINT:-http://localhost:4566}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      DOCUMENT_STORAGE_DISK: s3
      DOCUMENT_UPLOAD_DISK: s3_uploads
      DOCUMENT_MAX_UPLOAD_MB: ${DOCUMENT_MAX_UPLOAD_MB:-25}
      DOCUMENT_PRESIGNED_URL_LIFETIME_SECONDS: ${DOCUMENT_PRESIGNED_URL_LIFETIME_SECONDS:-600}
      DOCUMENT_UPLOAD_CONCURRENCY: ${DOCUMENT_UPLOAD_CONCURRENCY:-3}
      SQS_ENDPOINT: http://localstack:4566
      SQS_PREFIX: http://localstack:4566/000000000000
      SQS_QUEUE: ${INGESTION_QUEUE:-rag-platform-ingestion-local}
      INGESTION_WORKER_HMAC_PRIMARY_KEY_ID: ${INGESTION_WORKER_HMAC_PRIMARY_KEY_ID:-local-v1}
      INGESTION_WORKER_HMAC_PRIMARY_SECRET: ${INGESTION_WORKER_HMAC_PRIMARY_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      INGESTION_WORKER_HMAC_SECONDARY_KEY_ID: ${INGESTION_WORKER_HMAC_SECONDARY_KEY_ID:-}
      INGESTION_WORKER_HMAC_SECONDARY_SECRET: ${INGESTION_WORKER_HMAC_SECONDARY_SECRET:-}
      INGESTION_WORKER_HMAC_MAX_CLOCK_SKEW_SECONDS: ${INGESTION_WORKER_HMAC_MAX_CLOCK_SKEW_SECONDS:-300}
      PLATFORM_ADMIN_PRIMARY_KEY_ID: ${PLATFORM_ADMIN_PRIMARY_KEY_ID:-local-platform-admin-v1}
      PLATFORM_ADMIN_PRIMARY_KEY_VERSION: ${PLATFORM_ADMIN_PRIMARY_KEY_VERSION:-v1}
      PLATFORM_ADMIN_PRIMARY_SECRET: ${PLATFORM_ADMIN_PRIMARY_SECRET:-}
      PLATFORM_ADMIN_PRIMARY_REVOKED: ${PLATFORM_ADMIN_PRIMARY_REVOKED:-false}
      PLATFORM_ADMIN_SECONDARY_KEY_ID: ${PLATFORM_ADMIN_SECONDARY_KEY_ID:-}
      PLATFORM_ADMIN_SECONDARY_KEY_VERSION: ${PLATFORM_ADMIN_SECONDARY_KEY_VERSION:-v1}
      PLATFORM_ADMIN_SECONDARY_SECRET: ${PLATFORM_ADMIN_SECONDARY_SECRET:-}
      PLATFORM_ADMIN_SECONDARY_REVOKED: ${PLATFORM_ADMIN_SECONDARY_REVOKED:-false}
      OBSERVABILITY_RECONCILIATION_ENVIRONMENT: ${OBSERVABILITY_RECONCILIATION_ENVIRONMENT:-local}
      OBSERVABILITY_RECONCILIATION_PRIMARY_KEY_ID: ${OBSERVABILITY_RECONCILIATION_PRIMARY_KEY_ID:-local-observability-reconciler-v1}
      OBSERVABILITY_RECONCILIATION_PRIMARY_KEY_VERSION: ${OBSERVABILITY_RECONCILIATION_PRIMARY_KEY_VERSION:-v1}
      OBSERVABILITY_RECONCILIATION_PRIMARY_SECRET: ${OBSERVABILITY_RECONCILIATION_PRIMARY_SECRET:-}
      OBSERVABILITY_RECONCILIATION_PRIMARY_REVOKED: ${OBSERVABILITY_RECONCILIATION_PRIMARY_REVOKED:-false}
      OBSERVABILITY_RECONCILIATION_SECONDARY_KEY_ID: ${OBSERVABILITY_RECONCILIATION_SECONDARY_KEY_ID:-}
      OBSERVABILITY_RECONCILIATION_SECONDARY_KEY_VERSION: ${OBSERVABILITY_RECONCILIATION_SECONDARY_KEY_VERSION:-v1}
      OBSERVABILITY_RECONCILIATION_SECONDARY_SECRET: ${OBSERVABILITY_RECONCILIATION_SECONDARY_SECRET:-}
      OBSERVABILITY_RECONCILIATION_SECONDARY_REVOKED: ${OBSERVABILITY_RECONCILIATION_SECONDARY_REVOKED:-false}
      OPERATIONAL_METRICS_URL: ${OPERATIONAL_METRICS_URL:-http://otel-lgtm:9090}
      OPERATIONAL_METRICS_TIMEOUT_SECONDS: ${OPERATIONAL_METRICS_TIMEOUT_SECONDS:-1}
      OPERATIONAL_METRICS_CACHE_SECONDS: ${OPERATIONAL_METRICS_CACHE_SECONDS:-10}
      OPERATIONAL_GRAFANA_URL: ${OPERATIONAL_GRAFANA_URL:-http://127.0.0.1:3001}
      OPERATIONAL_ALERTMANAGER_URL: ${OPERATIONAL_ALERTMANAGER_URL:-http://alertmanager:9093}
      OPERATIONAL_ALERTMANAGER_PUBLIC_URL: ${OPERATIONAL_ALERTMANAGER_PUBLIC_URL:-http://127.0.0.1:9093}
      INGESTION_PROCESSING_LEASE_SECONDS: ${INGESTION_PROCESSING_LEASE_SECONDS:-120}
      INGESTION_CHUNK_BATCH_SIZE: ${INGESTION_CHUNK_BATCH_SIZE:-50}
      INGESTION_CHUNK_BODY_BYTES: ${INGESTION_CHUNK_BODY_BYTES:-1048576}
      INGESTION_RESUME_PAGE_SIZE: ${INGESTION_RESUME_PAGE_SIZE:-50}
      RETRIEVAL_AI_URL: ${RETRIEVAL_AI_URL:-http://ai:8001}
      RETRIEVAL_CALLER_HMAC_KEY_ID: ${RETRIEVAL_CALLER_HMAC_KEY_ID:-local-rc1}
      RETRIEVAL_CALLER_HMAC_SECRET: ${RETRIEVAL_CALLER_HMAC_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-480}
      RETRIEVAL_LOCAL_EXECUTION_ALLOWANCE_SECONDS: ${RETRIEVAL_LOCAL_EXECUTION_ALLOWANCE_SECONDS:-20}
      RETRIEVAL_TIMEOUT_SAFETY_MARGIN_SECONDS: ${RETRIEVAL_TIMEOUT_SAFETY_MARGIN_SECONDS:-20}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-4}
      EMBEDDING_MAX_PROVIDER_COOLDOWN_SECONDS: ${EMBEDDING_MAX_PROVIDER_COOLDOWN_SECONDS:-120}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-10}
      RERANKER_MAX_ATTEMPTS: ${RERANKER_MAX_ATTEMPTS:-3}
      RERANKER_MAX_PROVIDER_COOLDOWN_SECONDS: ${RERANKER_MAX_PROVIDER_COOLDOWN_SECONDS:-90}
      RETRIEVAL_MAX_ATTEMPTS: ${RETRIEVAL_MAX_ATTEMPTS:-2}
      RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-10}
      RETRIEVAL_CANDIDATE_K_MAX: ${RETRIEVAL_CANDIDATE_K_MAX:-100}
      RETRIEVAL_MAX_ELIGIBLE_DOCUMENTS: ${RETRIEVAL_MAX_ELIGIBLE_DOCUMENTS:-500}
      CONVERSATION_QUEUE: ${CONVERSATION_QUEUE:-conversation-generation}
      CONVERSATION_QUEUE_RETRY_AFTER: ${CONVERSATION_QUEUE_RETRY_AFTER:-960}
      CONVERSATION_CONTEXT_TURN_LIMIT: ${CONVERSATION_CONTEXT_TURN_LIMIT:-3}
      CONVERSATION_CONTEXT_MAX_CHARACTERS: ${CONVERSATION_CONTEXT_MAX_CHARACTERS:-24000}
      CONVERSATION_RUN_TIMEOUT_SECONDS: ${CONVERSATION_RUN_TIMEOUT_SECONDS:-900}
      CONVERSATION_DELIVERY_EVENT_LIMIT: ${CONVERSATION_DELIVERY_EVENT_LIMIT:-128}
      CONVERSATION_DELIVERY_EVENT_RETENTION_SECONDS: ${CONVERSATION_DELIVERY_EVENT_RETENTION_SECONDS:-86400}
      CONVERSATION_SSE_CONNECTION_SECONDS: ${CONVERSATION_SSE_CONNECTION_SECONDS:-25}
      CONVERSATION_SSE_POLL_MICROSECONDS: ${CONVERSATION_SSE_POLL_MICROSECONDS:-100000}
      GENERATION_DELIVERY_MODE: ${GENERATION_DELIVERY_MODE:-streaming_parts}
      RETRIEVAL_PLANNER_PROVIDER: ${RETRIEVAL_PLANNER_PROVIDER:-openai}
      RETRIEVAL_PLANNER_MODEL: ${RETRIEVAL_PLANNER_MODEL:-gpt-5-mini}
      EMBEDDING_ESTIMATED_COST_PER_MILLION_TOKENS_USD: ${EMBEDDING_ESTIMATED_COST_PER_MILLION_TOKENS_USD:-0.12}
      EMBEDDING_PRICING_SNAPSHOT: ${EMBEDDING_PRICING_SNAPSHOT:-voyage-pricing-2026-08-12}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-250}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: rag-platform-api
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: hello@dolved.ai
      MAIL_FROM_NAME: Dolved
    volumes:
      - ./apps/api:/app
      - ./contracts:/contracts:ro
      - ./tests/evaluation:/evaluation:ro
      - ./docs/evaluation/runs:/evaluation-runs
      - api_vendor:/app/vendor
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$context = stream_context_create(['http' => ['header' => 'Accept: application/json']]); $$body = @file_get_contents('http://127.0.0.1:8000/up', false, $$context); exit($$body === '{\"status\":\"up\"}' ? 0 : 1);"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  publisher:
    build:
      context: ./apps/api
      target: development
    image: rag-platform-api:development
    init: true
    command: php artisan ingestion:publish
    environment:
      APP_NAME: Dolved
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-rag_platform}
      DB_USERNAME: ${POSTGRES_USER:-rag_platform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      QUEUE_CONNECTION: sqs
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${DOCUMENT_UPLOAD_BUCKET:-rag-platform-document-uploads-local}
      SQS_ENDPOINT: http://localstack:4566
      SQS_PREFIX: http://localstack:4566/000000000000
      SQS_QUEUE: ${INGESTION_QUEUE:-rag-platform-ingestion-local}
      OUTBOX_PUBLISHER_BATCH_SIZE: ${OUTBOX_PUBLISHER_BATCH_SIZE:-10}
      OUTBOX_PUBLISHER_POLL_SECONDS: ${OUTBOX_PUBLISHER_POLL_SECONDS:-2}
      OUTBOX_CLAIM_LEASE_SECONDS: ${OUTBOX_CLAIM_LEASE_SECONDS:-60}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-250}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: rag-platform-ingestion-publisher
    volumes:
      - ./apps/api:/app
      - ./contracts:/contracts:ro
      - api_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 15s

  conversation-worker:
    build:
      context: ./apps/api
      target: development
    image: rag-platform-api:development
    init: true
    command: php artisan queue:work conversation --queue=conversation-generation,document-administration --tries=1 --timeout=900 --sleep=1
    environment:
      APP_NAME: Dolved
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-rag_platform}
      DB_USERNAME: ${POSTGRES_USER:-rag_platform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      DB_QUEUE_CONNECTION: pgsql
      CONVERSATION_QUEUE: ${CONVERSATION_QUEUE:-conversation-generation}
      DOCUMENT_ADMINISTRATION_QUEUE: ${DOCUMENT_ADMINISTRATION_QUEUE:-document-administration}
      CONVERSATION_QUEUE_RETRY_AFTER: ${CONVERSATION_QUEUE_RETRY_AFTER:-960}
      CONVERSATION_CONTEXT_TURN_LIMIT: ${CONVERSATION_CONTEXT_TURN_LIMIT:-3}
      CONVERSATION_CONTEXT_MAX_CHARACTERS: ${CONVERSATION_CONTEXT_MAX_CHARACTERS:-24000}
      CONVERSATION_RUN_TIMEOUT_SECONDS: ${CONVERSATION_RUN_TIMEOUT_SECONDS:-900}
      CONVERSATION_DELIVERY_EVENT_LIMIT: ${CONVERSATION_DELIVERY_EVENT_LIMIT:-128}
      CONVERSATION_DELIVERY_EVENT_RETENTION_SECONDS: ${CONVERSATION_DELIVERY_EVENT_RETENTION_SECONDS:-86400}
      CONVERSATION_SSE_CONNECTION_SECONDS: ${CONVERSATION_SSE_CONNECTION_SECONDS:-25}
      CONVERSATION_SSE_POLL_MICROSECONDS: ${CONVERSATION_SSE_POLL_MICROSECONDS:-100000}
      GENERATION_DELIVERY_MODE: ${GENERATION_DELIVERY_MODE:-streaming_parts}
      RETRIEVAL_AI_URL: ${RETRIEVAL_AI_URL:-http://ai:8001}
      RETRIEVAL_CALLER_HMAC_KEY_ID: ${RETRIEVAL_CALLER_HMAC_KEY_ID:-local-rc1}
      RETRIEVAL_CALLER_HMAC_SECRET: ${RETRIEVAL_CALLER_HMAC_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-480}
      RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-40}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: rag-platform-conversation-worker
    volumes:
      - ./apps/api:/app
      - ./contracts:/contracts:ro
      - api_vendor:/app/vendor
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  ai:
    build:
      context: ./apps/ai
      target: development
    image: rag-platform-ai:development
    init: true
    ports:
      - "${AI_PORT:-8001}:8001"
    environment:
      ENVIRONMENT: local
      SERVICE_NAME: rag-platform-ai
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      DOCUMENT_UPLOAD_BUCKET: ${DOCUMENT_UPLOAD_BUCKET:-rag-platform-document-uploads-local}
      DOCUMENT_UPLOAD_CORS_ALLOWED_ORIGIN: ${DOCUMENT_UPLOAD_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      INGESTION_QUEUE: ${INGESTION_QUEUE:-rag-platform-ingestion-local}
      INGESTION_DLQ: ${INGESTION_DLQ:-rag-platform-ingestion-dlq-local}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RETRIEVAL_CALLER_HMAC_KEYS: '${RETRIEVAL_CALLER_HMAC_KEYS:-{"local-rc1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}}'
      RETRIEVAL_CALLER_MAX_CLOCK_SKEW_SECONDS: ${RETRIEVAL_CALLER_MAX_CLOCK_SKEW_SECONDS:-300}
      RETRIEVAL_MAX_BODY_BYTES: ${RETRIEVAL_MAX_BODY_BYTES:-262144}
      RETRIEVAL_MAX_ELIGIBLE_DOCUMENTS: ${RETRIEVAL_MAX_ELIGIBLE_DOCUMENTS:-500}
      RETRIEVAL_CANDIDATE_K_MAX: ${RETRIEVAL_CANDIDATE_K_MAX:-100}
      RETRIEVAL_PLANNER_API_KEY: ${RETRIEVAL_PLANNER_API_KEY:-}
      RETRIEVAL_PLANNER_API_URL: ${RETRIEVAL_PLANNER_API_URL:-https://api.openai.com/v1/chat/completions}
      RETRIEVAL_PLANNER_PROVIDER: ${RETRIEVAL_PLANNER_PROVIDER:-openai}
      RETRIEVAL_PLANNER_MODEL: ${RETRIEVAL_PLANNER_MODEL:-gpt-5-mini}
      RETRIEVAL_PLANNER_TIMEOUT_SECONDS: ${RETRIEVAL_PLANNER_TIMEOUT_SECONDS:-60}
      CONTEXTUALISER_API_KEY: ${CONTEXTUALISER_API_KEY:-${RETRIEVAL_PLANNER_API_KEY:-}}
      CONTEXTUALISER_API_URL: ${CONTEXTUALISER_API_URL:-https://api.openai.com/v1/chat/completions}
      CONTEXTUALISER_PROVIDER: ${CONTEXTUALISER_PROVIDER:-openai}
      CONTEXTUALISER_MODEL: ${CONTEXTUALISER_MODEL:-gpt-5-mini}
      CONTEXTUALISER_TIMEOUT_SECONDS: ${CONTEXTUALISER_TIMEOUT_SECONDS:-60}
      CONTEXTUALISER_MAX_ATTEMPTS: ${CONTEXTUALISER_MAX_ATTEMPTS:-3}
      GENERATION_OPENAI_API_KEY: ${GENERATION_OPENAI_API_KEY:-${RETRIEVAL_PLANNER_API_KEY:-}}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-openai}
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-5-mini}
      GENERATION_PROMPT_VERSION: ${GENERATION_PROMPT_VERSION:-grounded-generation-v2}
      GENERATION_CONTRACT_VERSION: ${GENERATION_CONTRACT_VERSION:-generation-result-v1}
      GENERATION_ADAPTER_VERSION: ${GENERATION_ADAPTER_VERSION:-openai-responses-v1}
      GENERATION_REASONING_EFFORT: ${GENERATION_REASONING_EFFORT:-low}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-4096}
      GENERATION_CONTEXT_WINDOW_TOKENS: ${GENERATION_CONTEXT_WINDOW_TOKENS:-400000}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-120}
      GENERATION_MAX_ATTEMPTS: ${GENERATION_MAX_ATTEMPTS:-3}
      GENERATION_INITIAL_BACKOFF_SECONDS: ${GENERATION_INITIAL_BACKOFF_SECONDS:-2}
      GENERATION_MAX_BACKOFF_SECONDS: ${GENERATION_MAX_BACKOFF_SECONDS:-30}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_API_URL: ${VOYAGE_API_URL:-https://api.voyageai.com/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-4-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-4}
      EMBEDDING_INITIAL_BACKOFF_SECONDS: ${EMBEDDING_INITIAL_BACKOFF_SECONDS:-15}
      EMBEDDING_MAX_BACKOFF_SECONDS: ${EMBEDDING_MAX_BACKOFF_SECONDS:-120}
      EMBEDDING_MAX_PROVIDER_COOLDOWN_SECONDS: ${EMBEDDING_MAX_PROVIDER_COOLDOWN_SECONDS:-120}
      EMBEDDING_ESTIMATED_COST_PER_MILLION_TOKENS_USD: ${EMBEDDING_ESTIMATED_COST_PER_MILLION_TOKENS_USD:-0.12}
      EMBEDDING_PRICING_SNAPSHOT: ${EMBEDDING_PRICING_SNAPSHOT:-voyage-pricing-2026-08-12}
      VOYAGE_RERANK_API_URL: ${VOYAGE_RERANK_API_URL:-https://api.voyageai.com/v1/rerank}
      RERANKER_MODEL: ${RERANKER_MODEL:-rerank-2.5}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-10}
      RERANKER_MAX_ATTEMPTS: ${RERANKER_MAX_ATTEMPTS:-3}
      RERANKER_INITIAL_BACKOFF_SECONDS: ${RERANKER_INITIAL_BACKOFF_SECONDS:-15}
      RERANKER_MAX_BACKOFF_SECONDS: ${RERANKER_MAX_BACKOFF_SECONDS:-90}
      RERANKER_MAX_PROVIDER_COOLDOWN_SECONDS: ${RERANKER_MAX_PROVIDER_COOLDOWN_SECONDS:-90}
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-prithivida/Splade_PP_en_v1}
      SPARSE_EMBEDDING_SOURCE_REPOSITORY: ${SPARSE_EMBEDDING_SOURCE_REPOSITORY:-Qdrant/Splade_PP_en_v1}
      SPARSE_EMBEDDING_MODEL_REVISION: ${SPARSE_EMBEDDING_MODEL_REVISION:-efcd182bc7eb351e81a9445752d4388c2bab500b}
      SPARSE_EMBEDDING_CACHE_DIR: ${SPARSE_EMBEDDING_CACHE_DIR:-/opt/fastembed-cache}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-250}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    volumes:
      - ./apps/ai:/app
      - ./contracts:/contracts:ro
      - ./tests/evaluation:/evaluation:ro
      - ./docs/evaluation/generation:/generation-evaluation:ro
      - ./docs/evaluation/runs:/evaluation-runs
      - ./scripts:/workspace/scripts:ro
      - ai_venv:/app/.venv
      - fastembed_cache:/opt/fastembed-cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      localstack:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./apps/ai
      target: development
    image: rag-platform-ai:development
    init: true
    command: python -m app.worker
    environment:
      ENVIRONMENT: local
      SERVICE_NAME: rag-platform-ingestion-worker
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      INGESTION_QUEUE: ${INGESTION_QUEUE:-rag-platform-ingestion-local}
      INGESTION_DLQ: ${INGESTION_DLQ:-rag-platform-ingestion-dlq-local}
      INGESTION_WORKER_WAIT_TIME_SECONDS: ${INGESTION_WORKER_WAIT_TIME_SECONDS:-10}
      INGESTION_WORKER_VISIBILITY_TIMEOUT_SECONDS: ${INGESTION_WORKER_VISIBILITY_TIMEOUT_SECONDS:-120}
      INGESTION_PROCESSING_TIMEOUT_SECONDS: ${INGESTION_PROCESSING_TIMEOUT_SECONDS:-300}
      INGESTION_WORKER_HEARTBEAT_SECONDS: ${INGESTION_WORKER_HEARTBEAT_SECONDS:-30}
      INGESTION_WORKER_BATCH_SIZE: ${INGESTION_WORKER_BATCH_SIZE:-1}
      INGESTION_WORKER_ERROR_WAIT_SECONDS: ${INGESTION_WORKER_ERROR_WAIT_SECONDS:-2}
      INGESTION_WORKER_API_URL: http://api:8000
      INGESTION_WORKER_API_TIMEOUT_SECONDS: ${INGESTION_WORKER_API_TIMEOUT_SECONDS:-10}
      INGESTION_WORKER_CALLBACK_MAX_ATTEMPTS: ${INGESTION_WORKER_CALLBACK_MAX_ATTEMPTS:-3}
      INGESTION_WORKER_CALLBACK_BACKOFF_SECONDS: ${INGESTION_WORKER_CALLBACK_BACKOFF_SECONDS:-0.25}
      INGESTION_WORKER_HMAC_KEY_ID: ${INGESTION_WORKER_HMAC_PRIMARY_KEY_ID:-local-v1}
      INGESTION_WORKER_HMAC_SECRET: ${INGESTION_WORKER_HMAC_PRIMARY_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_API_URL: ${VOYAGE_API_URL:-https://api.voyageai.com/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-4-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-4}
      EMBEDDING_INITIAL_BACKOFF_SECONDS: ${EMBEDDING_INITIAL_BACKOFF_SECONDS:-15}
      EMBEDDING_MAX_BACKOFF_SECONDS: ${EMBEDDING_MAX_BACKOFF_SECONDS:-120}
      EMBEDDING_MAX_PROVIDER_COOLDOWN_SECONDS: ${EMBEDDING_MAX_PROVIDER_COOLDOWN_SECONDS:-120}
      EMBEDDING_ESTIMATED_COST_PER_MILLION_TOKENS_USD: ${EMBEDDING_ESTIMATED_COST_PER_MILLION_TOKENS_USD:-0.12}
      EMBEDDING_PRICING_SNAPSHOT: ${EMBEDDING_PRICING_SNAPSHOT:-voyage-pricing-2026-08-12}
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-prithivida/Splade_PP_en_v1}
      SPARSE_EMBEDDING_SOURCE_REPOSITORY: ${SPARSE_EMBEDDING_SOURCE_REPOSITORY:-Qdrant/Splade_PP_en_v1}
      SPARSE_EMBEDDING_MODEL_REVISION: ${SPARSE_EMBEDDING_MODEL_REVISION:-efcd182bc7eb351e81a9445752d4388c2bab500b}
      SPARSE_EMBEDDING_CACHE_DIR: ${SPARSE_EMBEDDING_CACHE_DIR:-/opt/fastembed-cache}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-250}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    volumes:
      - ./apps/ai:/app
      - ./contracts:/contracts:ro
      - ./tests/evaluation:/evaluation:ro
      - ai_venv:/app/.venv
      - fastembed_cache:/opt/fastembed-cache
    depends_on:
      api:
        condition: service_healthy
      localstack:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    stop_grace_period: 25s

  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  postgres:
    image: postgres:18.4-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
      POSTGRES_USER: ${POSTGRES_USER:-rag_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3,sqs
      SQS_ENDPOINT_STRATEGY: dynamic
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DOCUMENT_UPLOAD_BUCKET: ${DOCUMENT_UPLOAD_BUCKET:-rag-platform-document-uploads-local}
      INGESTION_QUEUE: ${INGESTION_QUEUE:-rag-platform-ingestion-local}
      INGESTION_DLQ: ${INGESTION_DLQ:-rag-platform-ingestion-dlq-local}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
    volumes:
      - ./infrastructure/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - ./scripts/localstack:/opt/rag-platform/localstack:ro
    tmpfs:
      - /var/lib/localstack
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal s3api head-bucket --bucket "$$DOCUMENT_UPLOAD_BUCKET"
          && awslocal sqs get-queue-url --queue-name "$$INGESTION_QUEUE"
          && awslocal sqs get-queue-url --queue-name "$$INGESTION_DLQ"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 15s

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  otel-lgtm:
    image: grafana/otel-lgtm:0.29.2
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - telemetry_data:/data
      - ./infrastructure/observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./infrastructure/observability/rules:/etc/dolved-observability/rules:ro
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 20s

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./infrastructure/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test:
        - CMD
        - /bin/amtool
        - --alertmanager.url=http://127.0.0.1:9093
        - config
        - show
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.153.0
    command:
      - --config=/etc/otelcol/config.yaml
    environment:
      OTEL_BACKEND_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_TRACE_SAMPLING_PERCENTAGE: ${OTEL_TRACE_SAMPLING_PERCENTAGE:-100}
    volumes:
      - ./infrastructure/opentelemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    depends_on:
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /otelcol
        - validate
        - --config=/etc/otelcol/config.yaml
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s

volumes:
  alertmanager_data:
  web_node_modules:
  web_next:
  api_vendor:
  ai_venv:
  postgres_data:
  qdrant_data:
  telemetry_data:
  fastembed_cache:
